name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release
        env:
          GITEA_TOKEN: ${{ gitea.token }}
        run: |
          gt release create "$GITEA_REF_NAME" main.js manifest.json --verify-tag
